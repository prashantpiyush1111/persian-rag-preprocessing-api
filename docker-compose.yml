services:
  rag-preprocessing-api:
    build: .
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_RECORDS: ${MAX_RECORDS:-10000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    restart: unless-stopped
